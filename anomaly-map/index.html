<!DOCTYPE html>
<!--
* Ingress Anomaly History Map
* Data sourced from: https://linktr.ee/ingressanomalystats
* Data originally collated by Breezy: https://linktr.ee/breenzy
 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ingress Anomaly History Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>
<div id="info-panel">
  <h3>Ingress Anomaly Map</h3>
  <button id="info-minimise">-</button>
  <div id="info-content">
    <div id="filters">
      <label>Series
        <button id="select-anomaly-series" type="button">
          Just Anomalies
        </button>
        <button id="reset-anomaly-series" type="button">
          Reset
        </button>
        <select id="series-filter" multiple>
        </select>
      </label>

      <label>Countries
        <button id="select-countries" type="button">
          Reset
        </button>
        <select id="country-filter" multiple>
        </select>
      </label>
      <div class="options">
        <label class="toggle">
          <input id="auto-pan-zoom" type="checkbox" checked>
          Auto pan/zoom
        </label>
      </div>
    </div>

    <p>Smaller = older. Colour intensity = margin of win.</p>
    <p>Use Ctrl-click to select multiple series.</p>

    <p>Map by <a href="https://link.ingress.com/agent/ShadowfootNZ" target="_blank" rel="noopener noreferrer" style="color:#28f428;">@ShadowfootNZ</a>. <br/>Data courtesy of <a href="https://linktr.ee/ingressanomalystats" target="_blank">Ingress Anomaly Stats</a>.</p>
      <p><a href="https://github.com/ShadowfootNZ/ingress" target="_blank" rel="noopener">Report issue</a></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  // Cache-bust map.js using build-meta.json (generated on commit)
  async function boot() {
    let v = Date.now().toString();
    try {
      const res = await fetch('./data/build-meta.json', { cache: 'no-store' });
      if (res.ok) {
        const meta = await res.json();
        v = meta.commit || meta.build || v;
      }
    } catch {
      // ignore; fall back to timestamp
    }

    const s = document.createElement('script');
    s.type = 'module';
    s.src = `map.js?v=${encodeURIComponent(v)}`;
    document.body.appendChild(s);
  }

  boot();
</script>
<div id="build-footer"></div>
</body>
</html>
