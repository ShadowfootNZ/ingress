<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time countdown tracker for upcoming Ingress anomaly events worldwide. Track Resistance vs Enlightened competitions with live timers and faction registration links.">
  <meta name="keywords" content="Ingress, anomaly, countdown, Niantic, Resistance, Enlightened, events">
  
  <title>Ingress Anomaly Countdown</title>
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../favicon-192x192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="countdown.css">
  
  <!-- Timezone handling library - must load before countdown.js -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js" defer></script>
  <script type="module" src="countdown.js"></script> <!-- defer is implied for module scripts -->
</head>

<body>
  <header>
    <h1>Ingress Anomaly Countdown</h1>
  </header>

  <main>
    <div id="anomalyList" class="anomaly-list" role="list"></div>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
  </main>

  <footer class="feedback">
    <nav aria-label="Additional resources">
       <p><a href="https://anomaly.day/">Anomaly Day and Season Rules</a></p>
      <p><a href="map.html">View map of upcoming anomalies with L16 recharge range</a></p>
      <p><a id="anomalyMapLink" href="../ingress-anomaly-map/">Anomaly Timeline &amp; Map</a></p>
      <p><a href="https://github.com/ShadowfootNZ/ingress" target="_blank" rel="noopener noreferrer">Report issue or submit link on Github</a></p>
      <p class="agent-badge">
        <a href="https://link.ingress.com/agent/ShadowfootNZ" target="_blank" rel="noopener noreferrer">@ShadowfootNZ</a>
      </p>
    </nav>
  </footer>
  <script>
    // Default href targets the custom domain (../ingress-anomaly-map/).
    // On GitHub Pages / local the apps are plain folders, so downgrade there.
    if (!/\/ingress-[^/]+\//.test(location.pathname)) {
      document.getElementById('anomalyMapLink').href = '../anomaly-map/';
    }
  </script>
  <script src="../analytics.js"></script>
</body>
</html>
