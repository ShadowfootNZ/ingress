<!doctype html>
<!-- mission-image-review.html
     Reviews locally-saved mission images from the images/ folder.
     Discovers files automatically via directory listing, extracts the prefix
     from filenames (format: "{prefix} {row}-{num}.{ext}"), and displays them
     grouped by prefix and row. Includes a real-time filename filter. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mission Image Review</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/mission-image-review.css">
</head>
<body>
  <header>
    <h1>Mission Image Review</h1>
    <label for="filter">Filter:</label>
    <input type="text" id="filter" placeholder="Type to filter by filename…" />
  </header>

  <main id="app" aria-live="polite"></main>

  <script src="./js/mission-image-review.js"></script>
  <script src="../analytics.js"></script>
</body>
</html>
