<!doctype html>
<!-- banner-map.html
     Leaflet-based map viewer for Ingress banners.
     Load a local JSON file or paste a Bannergress URL.
     Displays portals as colour-coded circle markers — one colour per mission —
     draws sequential mission paths as polylines, and shows a colour legend.
     Supports KML export for use in Google Maps / My Maps. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ingress Banner Map Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./css/map.css">

</head>
<body>
<header>
  <input type="file" id="loadJsonInput" accept=".json" style="display:none" aria-hidden="true">
  <button id="loadJsonBtn" type="button">Load UMM JSON…</button>
  <span style="color:#666;">or</span>
  <input type="text" id="bannergressUrl" placeholder="Bannergress URL…" aria-label="Bannergress banner URL">
  <button id="loadBannergressBtn" type="button">Load from Bannergress</button>
  <button id="downloadKmlBtn" type="button" disabled>Download KML</button>
  <strong id="missionSetName">Mission Set</strong>
</header>
<div id="map" role="region" aria-label="Map of portals"></div>
<footer id="status">Loading…</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./js/banner-map.js"></script>
<script src="../analytics.js"></script>
</body>
</html>
