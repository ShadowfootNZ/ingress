name: Deploy static apps

on:
  push:
    branches:
      - main
    paths:
      - 'bounty-progress/**'
      - 'countdown/**'
      - 'anomaly-map/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/deploy.sh'
      - 'scripts/test-carto-basemaps.mjs'
      - 'README.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bounty-progress
            remote_subdir: ingress-bounty-progress
          - app: countdown
            remote_subdir: ingress-countdown
          - app: anomaly-map
            remote_subdir: ingress-anomaly-map
          - app: key-map-viewer
            remote_subdir: ingress-key-map-viewer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test CARTO basemap configuration
        run: node scripts/test-carto-basemaps.mjs

      - name: Regenerate anomaly-map build metadata
        if: matrix.app == 'anomaly-map'
        run: |
          OUT="anomaly-map/data/build-meta.json"
          DATA="anomaly-map/data/anomalies-historical.json"
          BUILD_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          DATA_MTIME="$(date -u -d "$(git log -1 --format=%cd --date=iso-strict -- "$DATA")" +"%Y-%m-%dT%H:%M:%SZ")"
          cat > "$OUT" <<EOF
          {
            "build": "$BUILD_UTC",
            "commit": "$COMMIT_SHORT",
            "data_mtime": "$DATA_MTIME"
          }
          EOF

      - name: Generate CARTO configuration
        if: matrix.app == 'anomaly-map' || matrix.app == 'countdown'
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          : "${CARTO_API_KEY:?Add CARTO_API_KEY to the GitHub Actions repository secrets}"
          printf 'globalThis.CARTO_API_KEY = %s;\n' "$(printf '%s' "$CARTO_API_KEY" | jq -Rs .)" > "${{ matrix.app }}/carto-config.js"

      - name: Deploy ${{ matrix.app }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_NAME: ${{ matrix.app }}
          REMOTE_SUBDIR: ${{ matrix.remote_subdir }}
        run: bash scripts/deploy.sh
