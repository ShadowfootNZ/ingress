name: Deploy static apps

on:
  push:
    branches:
      - main
    paths:
      - 'bounty-progress/**'
      - 'countdown/**'
      - 'anomaly-map/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/deploy.sh'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bounty-progress
            remote_subdir: ingress-bounty-progress
          - app: countdown
            remote_subdir: ingress-countdown
          - app: anomaly-map
            remote_subdir: ingress-anomaly-map
          - app: key-map-viewer
            remote_subdir: ingress-key-map-viewer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.app }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_NAME: ${{ matrix.app }}
          REMOTE_SUBDIR: ${{ matrix.remote_subdir }}
        run: bash scripts/deploy.sh
